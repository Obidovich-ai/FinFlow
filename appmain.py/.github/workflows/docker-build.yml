name: Docker Build and Push

on:
  push:
    branches: [ "main" ] # Main branchga kod tushishi bilan ishga tushadi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t finflow-api:latest ./app
          echo "Loyiha muvaffaqiyatli yig'ildi!"
